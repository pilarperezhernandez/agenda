<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Agenda</title>
<meta name="description" content="Agenda de estudio: horario, tareas y planificador automático. Study planner: timetable, tasks and automatic scheduling.">
<meta name="application-name" content="Agenda">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Agenda">
<meta name="theme-color" content="#F4F3EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141518" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
/* Sin panel de chat: la app es solo la agenda */
.shell,.shell.chat-closed{grid-template-columns:var(--rail) 1fr}
.toggle-chat,.mob-chat{display:none!important}
@media (max-width:900px){ .shell,.shell.chat-closed{grid-template-columns:1fr;grid-template-rows:1fr auto} }
/* pantalla de acceso */
.auth{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.auth.open{display:flex}
.auth .box{width:min(360px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px 24px;box-shadow:var(--shadow)}
.auth .logo{margin:0 auto 14px}
.auth h1{font-family:var(--serif);font-weight:400;font-size:30px;margin:0 0 2px;text-align:center}
.auth h1 em{font-style:italic}
.auth p{color:var(--muted);text-align:center;margin:0 0 18px;font-size:13px}
.auth .field{margin-bottom:10px}
.auth .err{color:var(--danger);font-size:12px;min-height:16px;margin:4px 0 8px}
.auth .btn{width:100%;justify-content:center;padding:10px}
.offline{position:fixed;left:50%;top:8px;transform:translateX(-50%);background:var(--warn-soft);color:var(--warn);border:1px solid var(--line2);font-size:12px;font-weight:600;padding:4px 10px;border-radius:8px;z-index:90;display:none}
.offline.show{display:block}
</style>
</head>
<body>
<div class="auth" id="auth">
  <div class="box">
    <div class="logo">a</div>
    <h1><em>Agenda</em></h1>
    <p>Tu horario, tus tareas y un planificador que reparte el estudio en tus huecos.</p>
    <form id="authForm">
      <div class="field"><label>Correo</label><input type="email" id="aEmail" autocomplete="username" required></div>
      <div class="field"><label>Contraseña</label><input type="password" id="aPass" autocomplete="current-password" required></div>
      <div class="err" id="aErr"></div>
      <button class="btn primary" type="submit" id="aGo">Entrar</button>
      <p style="margin:12px 0 0"><a href="#" id="aForgot" style="color:var(--muted)">He olvidado la contraseña</a></p>
    </form>
    <div style="border-top:1px solid var(--line);margin-top:16px;padding-top:14px;text-align:center"><button class="btn" id="aDemo" type="button" style="width:100%;justify-content:center">Probar sin cuenta</button><p class="hint" style="margin:8px 0 0">Modo demo: los datos se guardan solo en este navegador.</p></div>
  </div>
</div>
<div class="offline" id="offline">Sin conexión · los cambios se guardarán al volver</div>
<div class="shell" id="shell">
  <aside class="rail">
    <div class="logo" title="Agenda">a<i class="dot" id="syncdot" title="Estado de sincronización"></i></div>
    <nav class="nav" role="tablist">
      <button data-view="today" title="Hoy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/><circle cx="12" cy="15" r="1.6" fill="currentColor" stroke="none"/></svg>Hoy</button>
      <button data-view="week" title="Semana"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M9 10v11M15 10v11"/></svg>Semana</button>
      <button data-view="month" title="Mes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M9 10v11M15 10v11M3 15.5h18"/></svg>Mes</button>
      <button data-view="tasks" title="Tareas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6.5l2 2 3.5-4M4 13l2 2 3.5-4M4 19.5l2 2 3.5-4M12 7h8M12 13.5h8M12 20h8"/></svg>Tareas</button>
      <button data-view="settings" title="Ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Ajustes</button>
    </nav>
    <div class="bottom">
      <button class="iconbtn" id="langBtn" title="Idioma" style="font-size:11px;font-weight:700;letter-spacing:.04em">ES/EN</button>
      <button class="iconbtn" id="themeBtn" title="Tema claro / oscuro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg></button>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div class="navbtns"><button class="btn icon ghost" id="prev" aria-label="Anterior">‹</button><button class="btn icon ghost" id="next" aria-label="Siguiente">›</button><button class="btn sm ghost" id="today">Hoy</button></div>
      <div class="title" id="title"></div>
      <span class="spacer"></span>
      <button class="btn" id="pracBtn" title="Elige qué días de esta semana vas a prácticas">Prácticas</button>
      <button class="btn primary" id="add">+ Nuevo</button>
    </header>
    <div class="banner" id="banner" hidden></div>
    <div class="content">
      <section class="view" id="view-today"><div class="today-v" id="todayv"></div></section>
      <section class="view" id="view-week"><div class="week"><div class="wk-scroll" id="wkscroll"><div class="wk-head" id="wkhead"></div><div class="allday" id="allday"></div><div class="wk-grid" id="wkgrid"></div></div></div></section>
      <section class="view" id="view-month"><div class="month"><div class="m-head"><div>Lun</div><div>Mar</div><div>Mié</div><div>Jue</div><div>Vie</div><div>Sáb</div><div>Dom</div></div><div class="m-grid" id="mgrid"></div></div></section>
      <section class="view" id="view-tasks"><div class="tasks" id="tasksv"></div></section>
      <section class="view" id="view-settings"><div class="settings" id="settings"></div></section>
    </div>
  </div>
</div>
<div class="backdrop" id="modal"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast"></div>
<div id="confirmWrap"><div id="confirmBox" role="alertdialog"><p id="confirmMsg"></p><div class="actions" style="margin:0"><span class="spacer"></span><button class="btn" id="confirmNo">Cancelar</button><button class="btn danger" id="confirmYes">Borrar</button></div></div></div>
<div id="popWrap"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="src/core.js"></script>
<script src="src/i18n.js"></script>
<script src="src/db.js"></script>
<script src="src/app.js"></script>
<script>
if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{})); }
</script>
</body>
</html>
